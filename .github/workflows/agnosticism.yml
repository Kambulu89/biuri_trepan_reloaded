name: Dataset agnosticism guard

# Guardrail arquitetural permanente (CLAUDE.md, secção 1): o sistema de produção (core/, gui/, counterfactuals/) não pode conhecer nenhum
# dataset. Qualquer PR que introduza, p.ex., `if dataset_name == "digits":`, um nome de dataset conhecido, uma política por dataset ou
# `import validation` dentro de core/ fica VERMELHO. Marque o job «agnosticism-guard» como *required status check* na proteção do ramo.
on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  agnosticism-guard:
    name: agnosticism-guard
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Static contract (stdlib only, runs before installing anything)
        run: python scripts/check_dataset_agnosticism.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt
      - name: Executable agnosticism contract (static + metamorphic + unknown dataset + ontology + resource policy)
        env:
          PYTHONHASHSEED: "0"
          OPENBLAS_NUM_THREADS: "1"
        run: >
          python -m pytest -q -p no:cacheprovider
          tests/test_agnosticism_contract.py
          tests/test_dataset_agnosticism.py
          tests/test_v92_static_guards.py
